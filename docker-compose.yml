version: '3.8'

services:
  mqtt:
    image: eclipse-mosquitto:latest
    container_name: vortex_mqtt
    ports:
      - "1883:1883"   # Port standard MQTT
      - "9001:9001"   # Port MQTT sur WebSockets (pratique pour le web)
    restart: always

  influxdb:
    image: influxdb:2.7
    container_name: vortex_influxdb
    ports:
      - "8086:8086"   # Port de l'interface web et API d'InfluxDB
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=vortex_admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=vortex_secure_password
      - DOCKER_INFLUXDB_INIT_ORG=vortex_org
      - DOCKER_INFLUXDB_INIT_BUCKET=meteo_data
    restart: always